# nginx: expose the astrology service under /astro/ on the tarotoo.com server block.
# Put the limit_req_zone line in the http {} context (for example in conf.d/) and the
# location block inside the server {} block for tarotoo.com.

# limit_req_zone $binary_remote_addr zone=astro:10m rate=30r/m;

location /astro/ {
    limit_req zone=astro burst=10 nodelay;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8781/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store";
}
